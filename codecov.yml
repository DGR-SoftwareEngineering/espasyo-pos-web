codecov:
  require_ci_to_pass: yes
  notify:
    after_n_builds: 1

coverage:
  precision: 2
  round: down
  range: "60...100"

  status:
    project:
      default:
        target: auto
        threshold: 5%
    patch:
      default:
        target: auto

component_management:
  components:
    - name: core-lib
      paths:
        - packages/core-lib/**
    - name: espasyo-pos
      paths:
        - apps/espasyo-pos/**

ignore:
  - "apps/web/**"
  - "apps/espasyo-customer-engagement/**"
  - "**/node_modules/**"
  - "**/__mocks__/**"
  - "**/*.d.ts"
  - "**/*.config.{js,ts}"
  - "**/__tests__/**"
