name: CI/CD

on:
  push:
    branches: [main, development, 'feature/**']
  pull_request:
    branches: [development, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install

      - name: Type check
        run: yarn turbo run typecheck --filter=espasyo-pos
        continue-on-error: true

      - name: Lint (errors only, no warnings)
        run: yarn turbo run lint --filter=espasyo-pos -- --quiet
        continue-on-error: true

      - name: Build
        run: yarn turbo run build --filter=espasyo-pos

      - name: Check bundle size
        run: |
          if [ -d "packages/espasyo-pos/.next" ]; then
            echo "📦 Bundle size:"
            du -sh packages/espasyo-pos/.next/static/*
          fi
      
      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            packages/*/dist
            packages/*/.next
            apps/*/dist
            apps/*/.next
          key: build-${{ github.sha }}

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Restore build artifacts
        uses: actions/cache/restore@v4
        with:
          path: |
            packages/*/dist
            packages/*/.next
            apps/*/dist
            apps/*/.next
          key: build-${{ github.sha }}

      - name: Install dependencies
        run: yarn install

      - name: Run tests with coverage
        run: yarn turbo run test --filter=core-lib

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: packages/core-lib/coverage
          flags: core-lib
          fail_ci_if_error: false
          verbose: true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install

      - name: Audit dependencies
        run: yarn audit --level=high
        continue-on-error: true

      - name: Check for exposed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  deploy:
    name: Deploy to ${{ github.ref == 'refs/heads/main' && 'Production' || 'Preview' }}
    needs: [quality, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/main')
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Restore build artifacts
        uses: actions/cache/restore@v4
        with:
          path: |
            packages/*/dist
            packages/*/.next
            apps/*/dist
            apps/*/.next
          key: build-${{ github.sha }}

      - name: Install dependencies
        run: yarn install --production=false

      - name: Install Vercel CLI
        run: yarn global add vercel@latest

      - name: Pull Vercel environment info
        run: |
          vercel pull --yes \
            --environment=${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }} \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for Vercel
        run: |
          vercel build \
            ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: |
          vercel deploy --prebuilt \
            ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Comment deployment URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: deployments } = await github.rest.repos.listDeployments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
            });
            
            if (deployments.length > 0) {
              const latestDeploy = deployments[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `🚀 Preview deployment ready!\n\n${latestDeploy.payload?.web_url || latestDeploy.url}`
              });
            }